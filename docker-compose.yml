services:
  mindforai:
    image: mindforai:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mindforai
    ports:
      - "${MINDFORAI_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
